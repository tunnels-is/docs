server {
    listen 80;
    listen [::]:80;
    server_name docs.tunnels.is;  # Change this to your domain or IP

    root /var/www/docs;  # Change this to your absolute path
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache favicon
    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # API endpoints - no caching, proxy to backend if needed
    # Currently these are static files from the build
    location /api/ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Docs data files
    location ~* \.data$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # React Router v7 SPA routing - handle client-side routes
    # This is critical for Fumadocs to work properly
    location / {
        # Try to serve the file directly, then try with .html, then fallback to index.html
        try_files $uri $uri.html $uri/ $uri/index.html /index.html;

        # Disable caching for HTML files to ensure users get updates
        location ~* \.html$ {
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
}

